<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Registration · RMU Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320; --deep: #0a2236; --foam: #5fd0c5; --ink: #eaf2f7; --muted: #8fa9bd;
            --line: rgba(143,169,189,0.18); --accent: #a99bf5; --accent-dim: #6c5fae;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Spline Sans', system-ui, sans-serif; margin: 0; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 24px; color: var(--ink);
            background:
                radial-gradient(120% 90% at 15% 8%, #2a2153 0%, transparent 55%),
                radial-gradient(130% 110% at 92% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            position: relative; overflow: hidden;
        }
        body::before {
            content: ""; position: absolute; inset: 0;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
            opacity: 0.5; pointer-events: none;
        }
        .waves { position: absolute; bottom: 0; left: 0; right: 0; width: 100%; opacity: 0.5; pointer-events: none; }
        .register-box {
            position: relative; z-index: 2; width: 380px; max-width: 100%; padding: 42px 38px 34px; border-radius: 20px;
            background: linear-gradient(165deg, rgba(28,28,64,0.74), rgba(10,30,48,0.78));
            border: 1px solid var(--line); box-shadow: 0 30px 70px -25px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(14px); animation: rise 0.7s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .crest {
            width: 50px; height: 50px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
            border-radius: 14px; background: linear-gradient(150deg, var(--accent), var(--accent-dim)); color: var(--abyss);
            box-shadow: 0 8px 22px -6px rgba(169,155,245,0.6);
        }
        .crest svg { width: 26px; height: 26px; }
        .eyebrow { text-align: center; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
        h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 27px; text-align: center; margin: 0 0 16px; letter-spacing: -0.01em; }
        .note {
            background: rgba(169,155,245,0.08); border-left: 3px solid var(--accent); padding: 11px 13px;
            font-size: 12.5px; color: #c7cbe8; margin-bottom: 14px; border-radius: 8px; line-height: 1.5;
        }
        input {
            width: 100%; padding: 13px 16px; margin: 7px 0; font-family: inherit; font-size: 15px; color: var(--ink);
            background: rgba(6,19,32,0.55); border: 1px solid var(--line); border-radius: 11px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input::placeholder { color: var(--muted); }
        input:focus { border-color: var(--accent-dim); background: rgba(6,19,32,0.75); box-shadow: 0 0 0 3px rgba(169,155,245,0.16); }
        button.submit {
            width: 100%; padding: 14px; margin-top: 12px; font-family: 'Spline Sans', sans-serif; font-size: 15px; font-weight: 600;
            color: var(--abyss); background: linear-gradient(145deg, var(--accent), var(--accent-dim)); border: none; border-radius: 11px;
            cursor: pointer; transition: transform 0.15s, box-shadow 0.25s, filter 0.2s; box-shadow: 0 12px 26px -10px rgba(169,155,245,0.55);
        }
        button.submit:hover { transform: translateY(-2px); filter: brightness(1.05); }
        #status { display: none; padding: 11px 14px; border-radius: 10px; margin-top: 14px; font-size: 13.5px; border: 1px solid transparent; }
        .foot { text-align: center; margin: 20px 0 0; font-size: 14px; color: var(--muted); }
        a { color: var(--accent); text-decoration: none; font-weight: 500; }
        a:hover { text-decoration: underline; }
        @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 480px) { .register-box { padding: 34px 24px 28px; } h2 { font-size: 24px; } }
    </style>
</head>
<body>
    <svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#1a1640" d="M0,128 C240,180 480,80 720,112 C960,144 1200,200 1440,150 L1440,220 L0,220 Z"/>
        <path fill="#13102f" d="M0,160 C260,120 520,196 780,168 C1040,140 1240,184 1440,170 L1440,220 L0,220 Z" opacity="0.85"/>
    </svg>

    <div class="register-box">
        <div class="crest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 5 14 12 12 19 10 12 Z"/>
            </svg>
        </div>
        <p class="eyebrow">Regional Maritime University</p>
        <h2>Lecturer Registration</h2>
        <div class="note">A lecturer registration code is required. Contact your administrator if you don't have one.</div>
        <input type="text" id="name" placeholder="Full Name" />
        <input type="email" id="email" placeholder="Email" />
        <input type="password" id="password" placeholder="Password" />
        <input type="password" id="lecturer-code" placeholder="Lecturer Registration Code" />
        <button class="submit" onclick="register()">Register as Lecturer</button>
        <div id="status"></div>
        <p class="foot">Already have an account? <a href="/login">Sign in</a></p>
    </div>

    <script>
        function showStatus(message, ok) {
            const s = document.getElementById('status');
            s.textContent = message;
            s.style.display = 'block';
            s.style.backgroundColor = ok ? 'rgba(95,208,197,0.12)' : 'rgba(231,76,60,0.12)';
            s.style.borderColor = ok ? 'rgba(95,208,197,0.4)' : 'rgba(231,76,60,0.4)';
            s.style.color = ok ? '#9fe8df' : '#f3a79e';
        }

        async function register() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const lecturer_code = document.getElementById('lecturer-code').value.trim();

            if (!name || !email || !password || !lecturer_code) {
                showStatus('Please fill in all fields including the lecturer code.', false);
                return;
            }

            const response = await fetch('/lecturer-register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, lecturer_code })
            });

            const data = await response.json();
            if (response.ok) {
                showStatus('Registration successful! Redirecting to login...', true);
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                showStatus(data.message, false);
            }
        }
    </script>
</body>
</html>
