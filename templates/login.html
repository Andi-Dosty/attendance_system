<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · RMU Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320;
            --deep: #0a2236;
            --hull: #0f2e47;
            --foam: #5fd0c5;
            --foam-dim: #2f8f88;
            --brass: #d9ad5b;
            --brass-soft: #f0d49a;
            --ink: #eaf2f7;
            --muted: #8fa9bd;
            --line: rgba(143, 169, 189, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Spline Sans', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
            background:
                radial-gradient(120% 90% at 15% 8%, #103754 0%, transparent 55%),
                radial-gradient(130% 110% at 92% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 75%);
            opacity: 0.5;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            top: -160px;
            right: -120px;
            background: radial-gradient(circle, rgba(95,208,197,0.16) 0%, transparent 70%);
            border-radius: 50%;
            animation: drift 14s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes drift {
            from { transform: translate(0, 0); }
            to   { transform: translate(-40px, 50px); }
        }

        .waves {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            width: 100%;
            opacity: 0.5;
            pointer-events: none;
        }

        .login-box {
            position: relative;
            z-index: 2;
            width: 380px;
            max-width: 100%;
            padding: 44px 40px 38px;
            border-radius: 20px;
            background: linear-gradient(165deg, rgba(20,52,77,0.72), rgba(10,30,48,0.78));
            border: 1px solid var(--line);
            box-shadow:
                0 30px 70px -25px rgba(0,0,0,0.65),
                inset 0 1px 0 rgba(255,255,255,0.06);
            backdrop-filter: blur(14px);
            animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .crest {
            width: 52px; height: 52px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: linear-gradient(150deg, var(--brass-soft), var(--brass));
            color: var(--abyss);
            box-shadow: 0 8px 22px -6px rgba(217,173,91,0.6);
            animation: rise 0.7s 0.05s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .crest svg { width: 28px; height: 28px; }

        .eyebrow {
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--brass-soft);
            margin: 0 0 6px;
            animation: rise 0.7s 0.1s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        h2 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 30px;
            text-align: center;
            margin: 0 0 28px;
            letter-spacing: -0.01em;
            animation: rise 0.7s 0.15s cubic-bezier(0.2,0.7,0.2,1) both;
        }

        .field {
            position: relative;
            margin-bottom: 16px;
            animation: rise 0.7s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .field:nth-of-type(1) { animation-delay: 0.2s; }
        .field:nth-of-type(2) { animation-delay: 0.27s; }

        input {
            width: 100%;
            padding: 14px 16px;
            font-family: inherit;
            font-size: 15px;
            color: var(--ink);
            background: rgba(6, 19, 32, 0.55);
            border: 1px solid var(--line);
            border-radius: 11px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input::placeholder { color: var(--muted); }
        input:focus {
            border-color: var(--foam-dim);
            background: rgba(6, 19, 32, 0.75);
            box-shadow: 0 0 0 3px rgba(95, 208, 197, 0.16);
        }

        button.submit {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            font-family: 'Spline Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--abyss);
            background: linear-gradient(145deg, var(--brass-soft), var(--brass));
            border: none;
            border-radius: 11px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
            box-shadow: 0 12px 26px -10px rgba(217,173,91,0.55);
            animation: rise 0.7s 0.34s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        button.submit:hover { transform: translateY(-2px); filter: brightness(1.04); box-shadow: 0 16px 30px -10px rgba(217,173,91,0.7); }
        button.submit:active { transform: translateY(0); }

        #status {
            display: none;
            padding: 11px 14px;
            border-radius: 10px;
            margin-top: 16px;
            font-size: 13.5px;
            border: 1px solid transparent;
        }

        .foot {
            text-align: center;
            margin: 22px 0 0;
            font-size: 14px;
            color: var(--muted);
            animation: rise 0.7s 0.4s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        a {
            color: var(--foam);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .login-box { padding: 36px 26px 30px; }
            h2 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <svg class="waves" viewBox="0 0 1440 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#0c2740" d="M0,128 C240,180 480,80 720,112 C960,144 1200,200 1440,150 L1440,220 L0,220 Z"/>
        <path fill="#0a1f33" d="M0,160 C260,120 520,196 780,168 C1040,140 1240,184 1440,170 L1440,220 L0,220 Z" opacity="0.85"/>
    </svg>

    <div class="login-box">
        <div class="crest">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
                <path d="M12 5 14 12 12 19 10 12 Z"/>
            </svg>
        </div>
        <p class="eyebrow">Regional Maritime University</p>
        <h2>Attendance Portal</h2>

        <div class="field">
            <input type="email" id="email" placeholder="University email" />
        </div>
        <div class="field">
            <input type="password" id="password" placeholder="Password" />
        </div>
        <button class="submit" onclick="login()">Sign In</button>
        <div id="status"></div>
        <p class="foot">New here? <a href="/register">Create an account</a></p>
    </div>

    <script>
        function showStatus(message, ok) {
            const s = document.getElementById('status');
            s.textContent = message;
            s.style.display = 'block';
            s.style.backgroundColor = ok ? 'rgba(95,208,197,0.12)' : 'rgba(231,76,60,0.12)';
            s.style.borderColor = ok ? 'rgba(95,208,197,0.4)' : 'rgba(231,76,60,0.4)';
            s.style.color = ok ? '#9fe8df' : '#f3a79e';
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showStatus('Please enter your email and password.', false);
                return;
            }

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('role', data.role);
                localStorage.setItem('user_id', data.user_id);
                showStatus('Login successful! Redirecting...', true);
                setTimeout(() => {
                    if (data.role === 'student') {
                        window.location.href = '/student-dashboard';
                    } else if (data.role === 'lecturer') {
                        window.location.href = '/lecturer-dashboard';
                    } else if (data.role === 'admin') {
                        window.location.href = '/admin-dashboard';
                    }
                }, 1000);
            } else {
                showStatus(data.message, false);
            }
        }

        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
