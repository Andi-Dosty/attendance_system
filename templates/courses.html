<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses · RMU Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320; --deep: #0a2236; --ink: #eaf2f7; --muted: #8fa9bd;
            --line: rgba(143,169,189,0.16); --accent: #d9ad5b; --accent-soft: #f0d49a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Spline Sans', system-ui, sans-serif; margin: 0; min-height: 100vh;
            padding: 26px; color: var(--ink);
            background:
                radial-gradient(110% 80% at 12% 0%, #2a2414 0%, transparent 55%),
                radial-gradient(120% 100% at 95% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            background-attachment: fixed;
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 80%);
            opacity: 0.4; pointer-events: none; z-index: 0;
        }
        .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 24px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(165deg, rgba(34,28,14,0.75), rgba(10,30,48,0.78));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -28px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .crest {
            width: 42px; height: 42px; flex: none; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; color: var(--abyss);
            background: linear-gradient(150deg, var(--accent-soft), var(--accent));
            box-shadow: 0 8px 20px -7px rgba(217,173,91,0.6);
        }
        .crest svg { width: 22px; height: 22px; }
        .brand .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-soft); margin: 0; }
        .brand h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 1px 0 0; }
        button { font-family: 'Spline Sans', sans-serif; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: transform 0.14s, filter 0.18s; }
        .btn-ghost { padding: 9px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent-soft); transform: translateY(-1px); }

        .card {
            padding: 26px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(170deg, rgba(17,46,71,0.5), rgba(8,24,40,0.6));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .card:nth-of-type(1) { animation-delay: 0.06s; }
        .card:nth-of-type(2) { animation-delay: 0.12s; }
        h2.card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin: 0 0 18px; }

        input, select {
            width: 100%; padding: 12px 14px; margin: 7px 0; font-family: inherit; font-size: 14px; color: var(--ink);
            background: rgba(6,19,32,0.55); border: 1px solid var(--line); border-radius: 10px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--muted); }
        input:focus, select:focus { border-color: rgba(217,173,91,0.5); box-shadow: 0 0 0 3px rgba(217,173,91,0.12); }
        select option { background: #0a2236; color: var(--ink); }

        .btn-primary {
            padding: 12px 24px; margin-top: 10px; font-weight: 600; color: var(--abyss);
            background: linear-gradient(145deg, var(--accent-soft), var(--accent));
            box-shadow: 0 10px 24px -10px rgba(217,173,91,0.55);
        }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.04); }

        #course-status { display: none; padding: 11px 14px; border-radius: 10px; margin-top: 14px; font-size: 13.5px; border: 1px solid transparent; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 14px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
        td { padding: 13px 14px; font-size: 14px; border-bottom: 1px solid rgba(143,169,189,0.08); color: #d4e2ec; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(217,173,91,0.04); }

        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            body { padding: 14px; }
            .header { flex-direction: column; align-items: flex-start; gap: 14px; }
            th, td { padding: 9px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="brand">
                <div class="crest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 5 14 12 12 19 10 12 Z"/>
                    </svg>
                </div>
                <div>
                    <p class="eyebrow">Regional Maritime University</p>
                    <h2>Manage Courses</h2>
                </div>
            </div>
            <button class="btn-ghost" onclick="window.location.href='/admin-dashboard'">Back to Dashboard</button>
        </div>

        <div class="card">
            <h2 class="card-title">Add New Course</h2>
            <input type="text" id="course-code" placeholder="Course Code (e.g. BIT101)" />
            <input type="text" id="course-name" placeholder="Course Name" />
            <select id="lecturer-id">
                <option value="">Select Lecturer</option>
            </select>
            <button class="btn-primary" onclick="addCourse()">Add Course</button>
            <div id="course-status"></div>
        </div>

        <div class="card">
            <h2 class="card-title">All Courses</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Code</th><th>Course Name</th><th>Lecturer</th></tr>
                    </thead>
                    <tbody id="courses-table">
                        <tr><td colspan="3">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }

        const token = localStorage.getItem('token');

        function showStatus(message, ok) {
            const s = document.getElementById('course-status');
            s.textContent = message;
            s.style.display = 'block';
            s.style.backgroundColor = ok ? 'rgba(95,208,197,0.12)' : 'rgba(231,76,60,0.12)';
            s.style.borderColor = ok ? 'rgba(95,208,197,0.4)' : 'rgba(231,76,60,0.4)';
            s.style.color = ok ? '#9fe8df' : '#f3a79e';
        }

        async function loadLecturers() {
            const response = await fetch('/admin-users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const users = await response.json();
            const select = document.getElementById('lecturer-id');
            users.filter(u => u.role === 'lecturer').forEach(l => {
                const option = document.createElement('option');
                option.value = l.user_id;
                option.textContent = l.name;
                select.appendChild(option);
            });
        }

        async function loadCourses() {
            const response = await fetch('/api/courses', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            const tbody = document.getElementById('courses-table');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No courses found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(c => `
                <tr>
                    <td>${c.course_code}</td>
                    <td>${c.course_name}</td>
                    <td>${c.lecturer_id || '-'}</td>
                </tr>
            `).join('');
        }

        async function addCourse() {
            const course_code = document.getElementById('course-code').value.trim();
            const course_name = document.getElementById('course-name').value.trim();
            const lecturer_id = document.getElementById('lecturer-id').value;

            if (!course_code || !course_name || !lecturer_id) {
                showStatus('Please fill in all fields.', false);
                return;
            }

            const response = await fetch('/api/courses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({ course_code, course_name, lecturer_id: parseInt(lecturer_id) })
            });

            const data = await response.json();
            showStatus(data.message, response.ok);
            if (response.ok) loadCourses();
        }

        loadLecturers();
        loadCourses();
    </script>
</body>
</html>
