<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses · RMU Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320; --deep: #0a2236; --foam: #5fd0c5; --foam-dim: #2f8f88; --brass: #d9ad5b;
            --ink: #eaf2f7; --muted: #8fa9bd; --line: rgba(143,169,189,0.16); --accent: #5fd0c5;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Spline Sans', system-ui, sans-serif; margin: 0; min-height: 100vh; padding: 26px; color: var(--ink);
            background:
                radial-gradient(110% 80% at 12% 0%, #103754 0%, transparent 55%),
                radial-gradient(120% 100% at 95% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            background-attachment: fixed;
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 80%);
            opacity: 0.4; pointer-events: none; z-index: 0;
        }
        .wrap { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(165deg, rgba(20,52,77,0.7), rgba(10,30,48,0.78));
            border: 1px solid var(--line); box-shadow: 0 24px 50px -28px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .crest { width: 42px; height: 42px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: var(--abyss); background: linear-gradient(150deg, var(--accent), var(--foam-dim)); box-shadow: 0 8px 20px -7px rgba(95,208,197,0.6); }
        .crest svg { width: 22px; height: 22px; }
        .brand .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0; }
        .brand h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 1px 0 0; }
        button { font-family: 'Spline Sans', sans-serif; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: transform 0.14s, box-shadow 0.22s, filter 0.18s, background 0.2s; }
        .btn-ghost { padding: 9px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
        .card {
            padding: 26px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(170deg, rgba(17,46,71,0.5), rgba(8,24,40,0.6));
            border: 1px solid var(--line); box-shadow: 0 24px 50px -30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .card:nth-of-type(2) { animation-delay: 0.1s; }
        h2.card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin: 0 0 16px; }
        .status { display: none; padding: 12px 15px; border-radius: 10px; margin-bottom: 14px; font-size: 13.5px; border: 1px solid transparent; }
        .status.success { background: rgba(95,208,197,0.12); border-color: rgba(95,208,197,0.4); color: #9fe8df; }
        .status.error { background: rgba(232,120,107,0.12); border-color: rgba(232,120,107,0.4); color: #f3a79e; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 14px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
        td { padding: 13px 14px; font-size: 14px; border-bottom: 1px solid rgba(143,169,189,0.08); color: #d4e2ec; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(95,208,197,0.05); }
        .btn-enroll { padding: 8px 18px; font-weight: 600; color: var(--abyss); background: linear-gradient(145deg, var(--accent), var(--foam-dim)); box-shadow: 0 10px 22px -12px rgba(95,208,197,0.6); }
        .btn-enroll:hover { transform: translateY(-1px); filter: brightness(1.05); }
        .btn-enroll:disabled { opacity: 0.6; cursor: default; transform: none; }
        .badge { background: rgba(95,208,197,0.14); color: var(--foam); padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(95,208,197,0.35); }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { body { padding: 14px; } .header { flex-direction: column; align-items: flex-start; gap: 14px; } th, td { padding: 9px 10px; font-size: 13px; } }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="brand">
                <div class="crest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 5 14 12 12 19 10 12 Z"/></svg>
                </div>
                <div>
                    <p class="eyebrow">Regional Maritime University</p>
                    <h2>My Courses</h2>
                </div>
            </div>
            <button class="btn-ghost" onclick="window.location.href='/student-dashboard'">Back to Dashboard</button>
        </div>

        <div class="card">
            <h2 class="card-title">My Enrolled Courses</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Code</th><th>Course Name</th><th>Enrolled Date</th></tr>
                    </thead>
                    <tbody id="my-courses-table">
                        <tr><td colspan="3">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Available Courses</h2>
            <div id="status" class="status"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>Code</th><th>Course Name</th><th>Action</th></tr>
                    </thead>
                    <tbody id="all-courses-table">
                        <tr><td colspan="3">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }

        const token = localStorage.getItem('token');
        let enrolledCourseIds = [];

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        async function loadMyCourses() {
            const response = await fetch('/api/my-courses', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            if (!response.ok) {
                document.getElementById('my-courses-table').innerHTML = '<tr><td colspan="3">Could not load courses.</td></tr>';
                return;
            }
            enrolledCourseIds = data.map(c => c.course_id);

            const tbody = document.getElementById('my-courses-table');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">You are not enrolled in any courses yet.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(c => `
                <tr>
                    <td>${c.course_code}</td>
                    <td>${c.course_name}</td>
                    <td>${c.enrolled_date}</td>
                </tr>
            `).join('');
        }

        async function loadAllCourses() {
            const response = await fetch('/api/courses', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            if (!response.ok) {
                document.getElementById('all-courses-table').innerHTML = '<tr><td colspan="3">Could not load courses.</td></tr>';
                return;
            }
            const tbody = document.getElementById('all-courses-table');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">No courses available.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(c => {
                const isEnrolled = enrolledCourseIds.includes(c.course_id);
                return `
                <tr>
                    <td>${c.course_code}</td>
                    <td>${c.course_name}</td>
                    <td>
                        ${isEnrolled
                            ? '<span class="badge">Enrolled</span>'
                            : `<button class="btn-enroll" onclick="enroll(${c.course_id}, this)">Enroll</button>`
                        }
                    </td>
                </tr>`;
            }).join('');
        }

        async function enroll(courseId, btn) {
            btn.disabled = true;
            btn.textContent = 'Enrolling...';

            const response = await fetch('/api/enroll', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ course_id: courseId })
            });

            const data = await response.json();
            if (response.ok) {
                showStatus(data.message, 'success');
                await loadMyCourses();
                await loadAllCourses();
            } else {
                showStatus(data.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Enroll';
            }
        }

        async function init() {
            await loadMyCourses();
            await loadAllCourses();
        }

        init();
    </script>
</body>
</html>
