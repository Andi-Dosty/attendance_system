<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports · RMU Attendance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320; --deep: #0a2236; --foam: #5fd0c5; --foam-dim: #2f8f88;
            --brass: #d9ad5b; --brass-soft: #f0d49a; --ink: #eaf2f7; --muted: #8fa9bd;
            --line: rgba(143,169,189,0.16); --accent: #d9ad5b; --accent-soft: #f0d49a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Spline Sans', system-ui, sans-serif; margin: 0; min-height: 100vh;
            padding: 26px; color: var(--ink);
            background:
                radial-gradient(110% 80% at 12% 0%, #2a2414 0%, transparent 55%),
                radial-gradient(120% 100% at 95% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            background-attachment: fixed;
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 80%);
            opacity: 0.4; pointer-events: none; z-index: 0;
        }
        .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 24px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(165deg, rgba(34,28,14,0.75), rgba(10,30,48,0.78));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -28px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .crest {
            width: 42px; height: 42px; flex: none; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; color: var(--abyss);
            background: linear-gradient(150deg, var(--accent-soft), var(--accent));
            box-shadow: 0 8px 20px -7px rgba(217,173,91,0.6);
        }
        .crest svg { width: 22px; height: 22px; }
        .brand .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-soft); margin: 0; }
        .brand h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 1px 0 0; }
        .nav { display: flex; gap: 10px; flex-wrap: wrap; }
        button { font-family: 'Spline Sans', sans-serif; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: transform 0.14s, filter 0.18s; }
        .btn-ghost { padding: 9px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent-soft); transform: translateY(-1px); }
        .btn-export {
            padding: 9px 18px; font-weight: 600; color: var(--abyss);
            background: linear-gradient(145deg, var(--accent-soft), var(--accent));
            box-shadow: 0 10px 22px -10px rgba(217,173,91,0.55);
        }
        .btn-export:hover { transform: translateY(-1px); filter: brightness(1.04); }

        .summary-row { display: flex; gap: 16px; margin-bottom: 22px; }
        .summary-card {
            flex: 1; padding: 22px 24px; border-radius: 16px; text-align: center;
            background: linear-gradient(170deg, rgba(17,46,71,0.5), rgba(8,24,40,0.6));
            border: 1px solid var(--line);
            box-shadow: 0 16px 40px -20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .summary-card:nth-child(1) { animation-delay: 0.05s; }
        .summary-card:nth-child(2) { animation-delay: 0.1s; }
        .summary-card:nth-child(3) { animation-delay: 0.15s; }
        .summary-card h3 { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 600; margin: 0; }
        .summary-card p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
        .total-card h3 { color: var(--accent-soft); }
        .present-card h3 { color: var(--foam); }
        .late-card h3 { color: var(--brass-soft); }

        .charts-row { display: flex; gap: 20px; margin-bottom: 22px; }
        .charts-row .card { flex: 1; }
        .chart-container { position: relative; height: 280px; }

        .card {
            padding: 26px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(170deg, rgba(17,46,71,0.5), rgba(8,24,40,0.6));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        h2.card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin: 0 0 18px; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 14px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
        td { padding: 13px 14px; font-size: 14px; border-bottom: 1px solid rgba(143,169,189,0.08); color: #d4e2ec; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(217,173,91,0.04); }
        td.present { color: var(--foam); font-weight: 600; }
        td.late { color: var(--brass-soft); font-weight: 600; }
        td.absent { color: #f3a79e; font-weight: 600; }

        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            body { padding: 14px; }
            .header { flex-direction: column; align-items: flex-start; gap: 14px; }
            .summary-row, .charts-row { flex-direction: column; }
            .summary-card h3 { font-size: 30px; }
            th, td { padding: 9px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="brand">
                <div class="crest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 5 14 12 12 19 10 12 Z"/>
                    </svg>
                </div>
                <div>
                    <p class="eyebrow">Regional Maritime University</p>
                    <h2>Attendance Reports</h2>
                </div>
            </div>
            <div class="nav">
                <button class="btn-export" onclick="exportCSV()">Export CSV</button>
                <button class="btn-ghost" onclick="history.back()">Back</button>
            </div>
        </div>

        <div class="summary-row">
            <div class="summary-card total-card">
                <h3 id="total-count">-</h3>
                <p>Total Records</p>
            </div>
            <div class="summary-card present-card">
                <h3 id="present-count">-</h3>
                <p>Present</p>
            </div>
            <div class="summary-card late-card">
                <h3 id="late-count">-</h3>
                <p>Late</p>
            </div>
        </div>

        <div class="charts-row">
            <div class="card">
                <h2 class="card-title">Attendance by Status</h2>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h2 class="card-title">Attendance by Course</h2>
                <div class="chart-container">
                    <canvas id="courseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Recent Attendance Records</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th><th>Course</th><th>Clock In</th><th>Status</th><th>Duration (mins)</th>
                        </tr>
                    </thead>
                    <tbody id="records-table">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }

        const token = localStorage.getItem('token');

        async function loadReports() {
            const response = await fetch('/api/reports', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) {
                window.location.href = '/login';
                return;
            }

            const data = await response.json();
            const present = data.status_breakdown['present'] || 0;
            const late = data.status_breakdown['late'] || 0;
            const total = present + late;

            document.getElementById('total-count').textContent = total;
            document.getElementById('present-count').textContent = present;
            document.getElementById('late-count').textContent = late;

            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Present', 'Late'],
                    datasets: [{
                        data: [present, late],
                        backgroundColor: ['#5fd0c5', '#d9ad5b'],
                        borderColor: ['#2f8f88', '#9c7a36'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#8fa9bd', padding: 16 } }
                    }
                }
            });

            new Chart(document.getElementById('courseChart'), {
                type: 'bar',
                data: {
                    labels: data.attendance_by_course.map(c => c.course),
                    datasets: [{
                        label: 'Attendance Count',
                        data: data.attendance_by_course.map(c => c.count),
                        backgroundColor: 'rgba(95,208,197,0.25)',
                        borderColor: '#5fd0c5',
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#8fa9bd' }, grid: { color: 'rgba(143,169,189,0.1)' } },
                        y: { beginAtZero: true, ticks: { stepSize: 1, color: '#8fa9bd' }, grid: { color: 'rgba(143,169,189,0.1)' } }
                    }
                }
            });

            const tbody = document.getElementById('records-table');
            if (data.recent_records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No records found.</td></tr>';
                return;
            }

            tbody.innerHTML = data.recent_records.map(r => `
                <tr>
                    <td>${r.student_name}</td>
                    <td>${r.course_name}</td>
                    <td>${r.clock_in_time}</td>
                    <td class="${r.status}">${r.status}</td>
                    <td>${r.duration_minutes}</td>
                </tr>
            `).join('');
        }

        function exportCSV() {
            fetch('/api/export-csv', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(r => r.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'attendance.csv';
                a.click();
                window.URL.revokeObjectURL(url);
            });
        }

        loadReports();
    </script>
</body>
</html>
