<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · RMU Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320; --deep: #0a2236; --foam: #5fd0c5; --foam-dim: #2f8f88;
            --brass: #d9ad5b; --brass-soft: #f0d49a; --ink: #eaf2f7; --muted: #8fa9bd;
            --line: rgba(143,169,189,0.16); --accent: #d9ad5b; --accent-soft: #f0d49a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Spline Sans', system-ui, sans-serif; margin: 0; min-height: 100vh;
            padding: 26px; color: var(--ink);
            background:
                radial-gradient(110% 80% at 12% 0%, #2a2414 0%, transparent 55%),
                radial-gradient(120% 100% at 95% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            background-attachment: fixed;
        }
        body::before {
            content: ""; position: fixed; inset: 0;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px; mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 80%);
            opacity: 0.4; pointer-events: none; z-index: 0;
        }
        .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 24px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(165deg, rgba(34,28,14,0.75), rgba(10,30,48,0.78));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -28px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .crest {
            width: 42px; height: 42px; flex: none; display: flex; align-items: center; justify-content: center;
            border-radius: 12px; color: var(--abyss);
            background: linear-gradient(150deg, var(--accent-soft), var(--accent));
            box-shadow: 0 8px 20px -7px rgba(217,173,91,0.6);
        }
        .crest svg { width: 22px; height: 22px; }
        .brand .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-soft); margin: 0; }
        .brand h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 1px 0 0; }
        .nav { display: flex; gap: 10px; flex-wrap: wrap; }
        button { font-family: 'Spline Sans', sans-serif; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: transform 0.14s, box-shadow 0.22s, filter 0.18s; }
        .btn-ghost { padding: 9px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent-soft); transform: translateY(-1px); }

        .stats-row { display: flex; gap: 16px; margin-bottom: 22px; }
        .stat-card {
            flex: 1; padding: 22px 24px; border-radius: 16px; text-align: center;
            background: linear-gradient(170deg, rgba(34,28,14,0.5), rgba(8,24,40,0.6));
            border: 1px solid var(--line);
            box-shadow: 0 16px 40px -20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.1s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card h3 { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 600; margin: 0; color: var(--accent-soft); }
        .stat-card p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

        .card {
            padding: 26px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(170deg, rgba(17,46,71,0.5), rgba(8,24,40,0.6));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px); animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .card:nth-of-type(1) { animation-delay: 0.2s; }
        .card:nth-of-type(2) { animation-delay: 0.26s; }
        h2.card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin: 0 0 18px; }

        input {
            width: 100%; padding: 12px 14px; margin: 7px 0; font-family: inherit; font-size: 14px; color: var(--ink);
            background: rgba(6,19,32,0.55); border: 1px solid var(--line); border-radius: 10px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: var(--muted); }
        input:focus { border-color: rgba(217,173,91,0.5); box-shadow: 0 0 0 3px rgba(217,173,91,0.12); }

        .btn-primary {
            padding: 12px 24px; margin-top: 10px; font-weight: 600; color: var(--abyss);
            background: linear-gradient(145deg, var(--accent-soft), var(--accent));
            box-shadow: 0 10px 24px -10px rgba(217,173,91,0.55);
        }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.04); }

        .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

        #location-status { display: none; padding: 11px 14px; border-radius: 10px; margin-top: 14px; font-size: 13.5px; border: 1px solid transparent; }

        .table-wrap { overflow-x: auto; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 14px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
        td { padding: 13px 14px; font-size: 14px; border-bottom: 1px solid rgba(143,169,189,0.08); color: #d4e2ec; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(217,173,91,0.04); }
        .role-badge {
            display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
        }
        .role-student { background: rgba(95,208,197,0.12); color: #9fe8df; border: 1px solid rgba(95,208,197,0.3); }
        .role-lecturer { background: rgba(169,155,245,0.12); color: #c9c0f8; border: 1px solid rgba(169,155,245,0.3); }
        .role-admin { background: rgba(217,173,91,0.12); color: var(--accent-soft); border: 1px solid rgba(217,173,91,0.3); }

        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            body { padding: 14px; }
            .header { flex-direction: column; align-items: flex-start; gap: 14px; }
            .stats-row { flex-direction: column; }
            .location-grid { grid-template-columns: 1fr; }
            th, td { padding: 9px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="brand">
                <div class="crest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 5 14 12 12 19 10 12 Z"/>
                    </svg>
                </div>
                <div>
                    <p class="eyebrow">Regional Maritime University</p>
                    <h2>Admin Dashboard</h2>
                </div>
            </div>
            <div class="nav">
                <button class="btn-ghost" onclick="window.location.href='/courses'">Courses</button>
                <button class="btn-ghost" onclick="window.location.href='/schedule-management'">Schedules</button>
                <button class="btn-ghost" onclick="window.location.href='/reports'">Reports</button>
                <button class="btn-ghost" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <h3 id="total-users">-</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-card">
                <h3 id="total-attendance">-</h3>
                <p>Attendance Records</p>
            </div>
            <div class="stat-card">
                <h3 id="total-courses">-</h3>
                <p>Total Courses</p>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Update Geofence Location</h2>
            <div class="location-grid">
                <input type="text" id="venue-name" placeholder="Venue Name" />
                <input type="number" id="radius" placeholder="Radius (meters)" />
                <input type="number" id="latitude" placeholder="Latitude" step="any" />
                <input type="number" id="longitude" placeholder="Longitude" step="any" />
            </div>
            <button class="btn-primary" onclick="updateLocation()">Update Location</button>
            <div id="location-status"></div>
        </div>

        <div class="card">
            <h2 class="card-title">All Users</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }

        const token = localStorage.getItem('token');

        async function loadStats() {
            const response = await fetch('/admin-stats', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            document.getElementById('total-users').textContent = data.total_users;
            document.getElementById('total-attendance').textContent = data.total_attendance;
            document.getElementById('total-courses').textContent = data.total_courses;
        }

        async function loadUsers() {
            const response = await fetch('/admin-users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            const tbody = document.getElementById('users-table');

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No users found</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(u => `
                <tr>
                    <td>${u.user_id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td><span class="role-badge role-${u.role}">${u.role}</span></td>
                    <td>${u.created_at}</td>
                </tr>
            `).join('');
        }

        async function updateLocation() {
            const response = await fetch('/update-location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify({
                    venue_name: document.getElementById('venue-name').value,
                    latitude: parseFloat(document.getElementById('latitude').value),
                    longitude: parseFloat(document.getElementById('longitude').value),
                    radius_meters: parseFloat(document.getElementById('radius').value)
                })
            });
            const data = await response.json();
            const s = document.getElementById('location-status');
            s.textContent = data.message;
            s.style.display = 'block';
            s.style.backgroundColor = response.ok ? 'rgba(95,208,197,0.12)' : 'rgba(231,76,60,0.12)';
            s.style.borderColor = response.ok ? 'rgba(95,208,197,0.4)' : 'rgba(231,76,60,0.4)';
            s.style.color = response.ok ? '#9fe8df' : '#f3a79e';
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        loadStats();
        loadUsers();
    </script>
</body>
</html>
