<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student · RMU Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #061320;
            --deep: #0a2236;
            --foam: #5fd0c5;
            --foam-dim: #2f8f88;
            --brass: #d9ad5b;
            --brass-soft: #f0d49a;
            --ink: #eaf2f7;
            --muted: #8fa9bd;
            --line: rgba(143, 169, 189, 0.16);
            --accent: #5fd0c5;
            --danger: #e8786b;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Spline Sans', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 26px;
            color: var(--ink);
            background:
                radial-gradient(110% 80% at 12% 0%, #103754 0%, transparent 55%),
                radial-gradient(120% 100% at 95% 100%, #0c2c44 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--abyss) 100%);
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed; inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at 50% 0%, black 0%, transparent 80%);
            opacity: 0.4; pointer-events: none; z-index: 0;
        }
        .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 24px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(165deg, rgba(20,52,77,0.7), rgba(10,30,48,0.78));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -28px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .crest {
            width: 42px; height: 42px; flex: none;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; color: var(--abyss);
            background: linear-gradient(150deg, var(--accent), var(--foam-dim));
            box-shadow: 0 8px 20px -7px rgba(95,208,197,0.6);
        }
        .crest svg { width: 22px; height: 22px; }
        .brand .eyebrow { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0; }
        .brand h2 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; margin: 1px 0 0; }
        .nav { display: flex; gap: 10px; flex-wrap: wrap; }

        button { font-family: 'Spline Sans', sans-serif; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; transition: transform 0.14s, box-shadow 0.22s, filter 0.18s, background 0.2s; }
        .btn-ghost { padding: 9px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

        .card {
            padding: 26px; margin-bottom: 22px; border-radius: 16px;
            background: linear-gradient(170deg, rgba(17,46,71,0.55), rgba(8,24,40,0.6));
            border: 1px solid var(--line);
            box-shadow: 0 24px 50px -30px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            animation: rise 0.6s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        .card:nth-of-type(1) { animation-delay: 0.06s; }
        .card:nth-of-type(2) { animation-delay: 0.12s; }
        h2.card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; margin: 0 0 4px; }
        .info { color: var(--muted); font-size: 13.5px; margin: 0 0 18px; }

        select {
            padding: 12px 14px; font-family: inherit; font-size: 14px; color: var(--ink);
            background: rgba(6,19,32,0.55); border: 1px solid var(--line); border-radius: 10px;
            outline: none; min-width: 280px; max-width: 100%; transition: border-color 0.2s, box-shadow 0.2s;
        }
        select:focus { border-color: var(--foam-dim); box-shadow: 0 0 0 3px rgba(95,208,197,0.15); }
        select option { background: #0a2236; color: var(--ink); }

        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
        .btn-clockin { padding: 12px 26px; font-weight: 600; color: var(--abyss); background: linear-gradient(145deg, var(--accent), var(--foam-dim)); box-shadow: 0 12px 26px -12px rgba(95,208,197,0.6); }
        .btn-clockin:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-clockout { padding: 12px 26px; font-weight: 600; color: #ffd9d2; background: rgba(232,120,107,0.12); border: 1px solid rgba(232,120,107,0.45); }
        .btn-clockout:hover { background: rgba(232,120,107,0.2); transform: translateY(-2px); }

        .status { display: none; padding: 12px 15px; border-radius: 10px; margin-top: 16px; font-size: 13.5px; border: 1px solid transparent; }
        .status.success { background: rgba(95,208,197,0.12); border-color: rgba(95,208,197,0.4); color: #9fe8df; }
        .status.error { background: rgba(232,120,107,0.12); border-color: rgba(232,120,107,0.4); color: #f3a79e; }

        .table-wrap { overflow-x: auto; margin-top: 14px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px 14px; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
        td { padding: 13px 14px; font-size: 14px; border-bottom: 1px solid rgba(143,169,189,0.08); color: #d4e2ec; }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: rgba(95,208,197,0.05); }
        td.present { color: var(--foam); font-weight: 600; }
        td.late { color: var(--brass-soft); font-weight: 600; }
        td.absent { color: #f3a79e; font-weight: 600; }

        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            body { padding: 14px; }
            .header { flex-direction: column; align-items: flex-start; gap: 14px; }
            select { min-width: 100%; }
            .actions { width: 100%; }
            .btn-clockin, .btn-clockout { flex: 1; }
            th, td { padding: 9px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="header">
            <div class="brand">
                <div class="crest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 5 14 12 12 19 10 12 Z"/>
                    </svg>
                </div>
                <div>
                    <p class="eyebrow">Regional Maritime University</p>
                    <h2>Student Dashboard</h2>
                </div>
            </div>
            <div class="nav">
                <button class="btn-ghost" onclick="window.location.href='/enrollment'">My Courses</button>
                <button class="btn-ghost" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">Mark Attendance</h2>
            <p class="info">Your location will be checked before attendance is recorded.</p>
            <select id="schedule-id">
                <option value="">Select Session</option>
            </select>
            <div class="actions">
                <button class="btn-clockin" onclick="clockIn()">Clock In</button>
                <button class="btn-clockout" onclick="clockOut()">Clock Out</button>
            </div>
            <div id="status" class="status"></div>
        </div>

        <div class="card">
            <h2 class="card-title">My Attendance Records</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Clock In</th>
                            <th>Clock Out</th>
                            <th>Duration (mins)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="records-table">
                        <tr><td colspan="5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login';
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        async function loadSchedules() {
            const token = localStorage.getItem('token');
            const response = await fetch('/schedules', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            const select = document.getElementById('schedule-id');
            data.forEach(s => {
                const option = document.createElement('option');
                option.value = s.schedule_id;
                option.textContent = s.course_name + ' — ' + s.start_time;
                select.appendChild(option);
            });
        }

        function clockIn() {
            const scheduleId = document.getElementById('schedule-id').value;
            if (!scheduleId) {
                showStatus('Please select a session before clocking in.', 'error');
                return;
            }

            if (!navigator.geolocation) {
                showStatus('Geolocation is not supported by your browser', 'error');
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                const token = localStorage.getItem('token');
                const response = await fetch('/clock-in', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        schedule_id: parseInt(scheduleId),
                        latitude: lat,
                        longitude: lng
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('attendance_id', data.attendance_id);
                    showStatus('Clocked in at ' + data.clock_in_time, 'success');
                } else {
                    showStatus(data.message, 'error');
                }
            }, () => {
                showStatus('Unable to get your location. Please allow location access.', 'error');
            });
        }

        async function clockOut() {
            const attendanceId = localStorage.getItem('attendance_id');
            if (!attendanceId) {
                showStatus('You have not clocked in yet', 'error');
                return;
            }

            const token = localStorage.getItem('token');
            const response = await fetch('/clock-out', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ attendance_id: parseInt(attendanceId) })
            });

            const data = await response.json();
            if (response.ok) {
                localStorage.removeItem('attendance_id');
                showStatus('Clocked out. Duration: ' + Math.round(data.duration_minutes) + ' minutes', 'success');
            } else {
                showStatus(data.message, 'error');
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        async function loadRecords() {
            const token = localStorage.getItem('token');
            const response = await fetch('/attendance-records', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await response.json();
            const tbody = document.getElementById('records-table');

            if (!response.ok || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No attendance records yet.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(r => `
                <tr>
                    <td>${r.course_name}</td>
                    <td>${r.clock_in_time || '-'}</td>
                    <td>${r.clock_out_time || '-'}</td>
                    <td>${r.duration_minutes ? Math.round(r.duration_minutes) : '-'}</td>
                    <td class="${r.status}">${r.status}</td>
                </tr>
            `).join('');
        }

        loadSchedules();
        loadRecords();
    </script>
</body>
</html>
